<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Page">
    <meta name="author" content="Manuel Chave">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
    <link rel="stylesheet" href="styles/task.css">


    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/tasks.js" defer></script>
    <link rel="shortcut icon" href="images/studytrack.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>StudyTrack- subjects Form</title>
</head>

<body>
    <div class="conteiner">
        <header>
            <div><img src="images/studytrack.webp" alt="Site logo "> <span>StudyTrack</span>
                <button class="humburguer" id="humburguer"></button>
            </div>

            <nav id="navbar" class="navbar">
                <ul>
                    <li><a href="index.html"><img src="images/home.svg" alt="Home icon">Home</a></li>
                    <li><a href="subjects.html"><img src="images/books.svg" alt="Subjects icon">Subjects</a></li>
                    <li><a href="tasks.html"><img src="images/time-span.svg" alt="Tasks">Tasks</a></li>
                </ul>
            </nav>
        </header>
        <main class="main-content">
            <section aria-labelledby="tasksTitle">
                <div class="page-heading">
                    <div>
                        <h1 id="tasksTitle">My Tasks</h1>
                        <p>Plan your work and keep track of your assignments.</p>
                    </div>

                    <a href="tasksForm.html" class="add-subject">+ Add Task</a>
                </div>

                <div class="subject-search">
                    <label for="taskSearch">Search tasks</label>
                    <input type="search" id="taskSearch" placeholder="Search by task or subject name..."
                        autocomplete="off">
                </div>

                <div class="task-filters">
                    <label for="taskFilter">Show</label>
                    <select id="taskFilter">
                        <option value="all">All tasks</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div id="tasksContent" class="tasks-content" aria-live="polite">
                    <p>Loading tasks...</p>
                </div>
            </section>
        </main>

    </div>
</body>

</html>

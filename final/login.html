<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Page">
    <meta name="author" content="Manuel Chave">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>StudyTrack-login</title>
</head>

<body>
    <div class="conteiner">
        <main>
            <div class="mainContent">
                <aside class="asideContent">
                    <div class="universityLogo">
                        <img src="#" alt="university logo">
                        <h2>StudyTrack</h2>
                        <p>You progress start here!</p>
                    </div>
                    <div class="universityInform">
                        <img src="#" alt="Books images">
                        <p><img src="#" alt="Subjects icon"><span>Manege your subjects</span></p>
                        <p><img src="#" alt="Watch your tasks icon"><span>Watch your tasks</span></p>
                        <p><img src="#" alt="monitory you progress icon"><span>Manege your subjects</span></p>
                    </div>
                </aside>
                <div class="login-information">
                    <div class="login">
                        <h1>Welcome</h1>
                        <p>Login to continue your jorney</p>
                        <form action="#" method="get" class="form">
                            <input type="email" required placeholder="E-mail" title="E-mail" name="email"><br>
                            <input type="password" required placeholder="Password" title="Password" name="password"><br>
                            <div class="rememberPassword">
                                <label for="checkbox"> <input type="checkbox" name="checkbox"
                                        id="checkBox">Remember</label>
                                <p class="forgotePassword"><a href="#">Forgotted Password?</a></p>
                            </div>
                            <input type="submit" value="Enter">
                        </form>
                        <p class="doNotHaveAccount">Do not have account? <span><a
                                    href="register.html">Register</a></span>
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Page">
    <meta name="author" content="Manuel Chave">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">


    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/subjectsForm.js" defer></script>
    <link rel="shortcut icon" href="images/studytrack.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>StudyTrack- subjects Form</title>
</head>

<body>
    <div class="conteiner">
        <header>
            <div><img src="images/studytrack.webp" alt="Site logo "> <span>StudyTrack</span>
                <button class="humburguer" id="humburguer"></button>
            </div>

            <nav id="navbar" class="navbar">
                <ul>
                    <li><a href="index.html"><img src="images/home.svg" alt="Home icon">Home</a></li>
                    <li><a href="subjects.html"><img src="images/books.svg" alt="Subjects icon">Subjects</a></li>
                    <li><a href="tasks.html"><img src="images/time-span.svg" alt="Tasks">Tasks</a></li>
                </ul>
            </nav>
        </header>
        <main class="main-content">
            <section class="subject-form-container">
                <h1 id="formTitle">Add New Subject</h1>
                <p>Enter the information about the subject you want to study.</p>

                <form id="subjectForm" class="form">
                    <div class="form-field">
                        <label for="subjectName">Subject Name</label>
                        <input type="text" id="subjectName" name="subjectName" placeholder="Example: WDD231" required
                            maxlength="100">
                    </div>

                    <div class="form-field">
                        <label for="subjectDescription">Description</label>
                        <textarea id="subjectDescription" name="subjectDescription" rows="5"
                            placeholder="What would you like to learn in this subject?" maxlength="500"></textarea>
                    </div>

                    <p id="formMessage" role="status"></p>

                    <div class="btns">
                        <a href="subjects.html" class="cancel-button">Cancel</a>
                        <button type="submit" class="save-button">Save Subject</button>
                    </div>
                </form>
            </section>
        </main>

    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Page">
    <meta name="author" content="Manuel Chave">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/large.css">
    <script src="scripts/login.js" defer></script>
    <link rel="shortcut icon" href="images/studytrack.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>StudyTrack-Register</title>
</head>

<body>
    <div class="conteiner">
        <main>
            <div class="mainContent">
                <aside class="asideContent">
                    <div class="universityLogo">
                        <img src="images/studytrack.webp" alt="university logo">
                        <h2>StudyTrack</h2>
                        <p>You progress start here!</p>
                    </div>

                    <div class="universityInform">
                        <img src="#" alt="Books images">
                        <p><img src="#" alt="Subjects icon"><span>Manege your subjects</span></p>
                        <p><img src="#" alt="Watch your tasks icon"><span>Watch your tasks</span></p>
                        <p><img src="#" alt="monitory you progress icon"><span>Manege your subjects</span></p>
                    </div>

                </aside>
                <div class="login-information">
                    <div class="login">
                        <h1>Creat Account</h1>
                        <p>Fill the form with your information to start</p>

                        <form action="#" method="post" class="form" id="registerForm">
                            <label for="full-name">Full Name</label> <br>
                            <input type="text" id="full-name" name="full-name" placeholder="Ex: Joseph Smith"
                                autocomplete="name" required> <br>

                            <label for="email">Email</label> <br>
                            <input type="email" id="email" name="email" placeholder="Email address" autocomplete="email"
                                required> <br>

                            <label for="password">Password</label> <br>
                            <input type="password" id="password" name="password" placeholder="At least 8 characters"
                                autocomplete="new-password" minlength="8" required> <br>

                            <input type="submit" value="Register" id="btnSubmit">
                        </form>


                        <p class="haveAccount"> Have an account? <span><a href="login.html">Enter</a></span></p>
                    </div>
                </div>

            </div>

        </main>
        <dialog class="myModal" id="myModal">
            <div class="universityLogo">
                <img src="images/studytrack.webp" alt="university logo">
                <h2>StudyTrack</h2>
                <p> Thanks for your registration</p>
            </div>
            <button type="button" id="btnGoLogin"><a href="login.html">Go to Login</a></button>
        </dialog>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Manuel Chave">
  <meta name="description"
    content="Discover easy and delicious recipes for every day. Explore simple meals, desserts, ingredients, and step-by-step cooking instructions.">

  <meta property="og:title" content="Recipes">
  <meta property="og:description"
    content="Find easy recipes, explore different food categories, and learn how to prepare delicious meals at home.">

  <meta property="og:image"
    content="https://raw.githubusercontent.com/ManuelChave1/wdd231/refs/heads/main/final/images/vegetable-soup.webp">

  <meta property="og:url" content="https://manuelchave1.github.io/wdd231/final/index.html">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css">
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="shortcut icon" href="images/pan.ico" type="image/x-icon">

  <script src="scripts/recipes.js" defer></script>
  <script src="scripts/dates.js" defer></script>
  <script src="scripts/navigation.js" defer></script>
  <title>Recipes | Recipes</title>

</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">🍲 <span>Recipes</span></a>
    <button class="btn-humburguer" id="btn-humburguer"></button>
    <nav class="navBar" id="navBar">
      <a href="index.html">Home</a>
      <a class="active" href="recipes.html">Recipes</a>
      <a href="favorites.html">Favorites</a>
    </nav>
  </header>

  <main class="section page-main">
    <p class="eyebrow">COOKING INSPIRATION</p>
    <h1 id="page-title">All Recipes</h1>
    <p class="page-intro">Choose a recipe, check the ingredients, and start cooking.</p>

    <div class="filters">
      <label class="search-label">
        <span class="sr-only">Search recipes</span>
        <input id="search-input" type="search" placeholder="Search by recipe name...">
      </label>
      <label>
        <span class="sr-only">Filter by category</span>
        <select id="category-select">
          <option value="All">All categories</option>
          <option value="Main Course">Main Course</option>
          <option value="Soup">Soup</option>
          <option value="Salad">Salad</option>
          <option value="Dessert">Dessert</option>
          <option value="Breakfast">Breakfast</option>
        </select>
      </label>
    </div>

    <div id="recipes-list" class="recipe-grid">
      <p>Loading recipes...</p>
    </div>
    <p id="empty-message" class="empty-message hidden">No recipes found.</p>
  </main>
  <dialog id="recipe-dialog">
    <div class="dialog-content">
      <button type="button" id="close-dialog" class="close-dialog" aria-label="Close recipe details">
        &times;
      </button>

      <img id="dialog-image" src="" alt="">

      <h2 id="dialog-title"></h2>

      <span id="dialog-category" class="category"></span>

      <p id="dialog-description"></p>

      <div class="recipe-meta">
        <span id="dialog-time"></span>
        <span id="dialog-servings"></span>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <a class="logo" href="index.html">🍲 <span>Recipes</span></a>
    <p>Easy and practical recipes for your kitchen.</p>
    <p id="currentYear" class="currentyear"></p> <br>
    <p id="lastModified" class="lastModified"></p>
  </footer>
</body>

</html>

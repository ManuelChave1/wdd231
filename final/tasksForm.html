<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Page">
    <meta name="author" content="Manuel Chave">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">


    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/taskForm.js" defer></script>
    <link rel="shortcut icon" href="images/studytrack.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>StudyTrack- Task Form</title>
</head>

<body>
    <div class="conteiner">
        <header>
            <div><img src="images/studytrack.webp" alt="Site logo "> <span>StudyTrack</span>
                <button class="humburguer" id="humburguer"></button>
            </div>

            <nav id="navbar" class="navbar">
                <ul>
                    <li><a href="index.html"><img src="images/home.svg" alt="Home icon">Home</a></li>
                    <li><a href="subjects.html"><img src="images/books.svg" alt="Subjects icon">Subjects</a></li>
                    <li><a href="tasks.html"><img src="images/time-span.svg" alt="Tasks">Tasks</a></li>
                </ul>
            </nav>
        </header>
        <main class="main-content">
            <section class="subject-form-container">
                <h1 id="taskFormTitle">Add New Task</h1>
                <p>Create a task and connect it to one of your subjects.</p>

                <form id="taskForm" class="form">
                    <div class="form-field">
                        <label for="taskTitle">Task Title</label>
                        <input type="text" id="taskTitle" name="taskTitle"
                            placeholder="Example: Finish JavaScript project" maxlength="120" required>
                    </div>

                    <div class="form-field">
                        <label for="subjectId">Subject</label>
                        <select id="subjectId" name="subjectId" required>
                            <option value="">Choose a subject</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate" name="dueDate" required>
                    </div>

                    <div class="form-field">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription" name="taskDescription" rows="5" maxlength="1000"
                            placeholder="Add details about this task"></textarea>
                    </div>

                    <p id="taskFormMessage" role="status"></p>

                    <div class="btns">
                        <a href="tasks.html" class="cancel-button">Cancel</a>
                        <button type="submit" class="save-button">Save Task</button>
                    </div>
                </form>
            </section>
        </main>

    </div>
</body>

</html>
